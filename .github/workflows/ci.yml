name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://backend:backend@127.0.0.1:5432/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements/local.txt
      - name: Linter
        run: flake8 .
      - name: Contratos de imports
        run: lint-imports --no-cache
      - name: Configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Validar OpenAPI
        run: python manage.py spectacular --validate --fail-on-warn --format openapi-json --file schema.json
      - name: Tests con PostgreSQL y cobertura
        run: pytest --cov --cov-report=term-missing
